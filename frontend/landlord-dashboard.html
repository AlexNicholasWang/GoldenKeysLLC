<!DOCTYPE html>
<html>
<head>
  <title>Keyfolio Landlord Dashboard</title>
  <style>
    .status-msg {
      font-size: 0.85em;
      margin-left: 8px;
      font-weight: bold;
    }
    .status-success { color: green; }
    .status-error { color: red; }
  </style>
</head>
<body>

  <div id="error" style="display: none;">Authentication failed. Try to sign in again.</div>
  <div id="dashboard" style="display: none;">
    <h1 id="welcome"></h1>
    <a href="index.html">Go Home</a>
    <br><br>
    <h3>Tenants</h3>
    <table border="1" cellpadding="6" cellspacing="0">
      <thead>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Email</th>
          <th>Address</th>
          <th>Rent ($)</th>
          <th>Day</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tenants-list"></tbody>
    </table>
  </div>

  <script>
    window.onload = function() {
      const token = sessionStorage.getItem("googleToken");
      
      if (!token) {
        document.getElementById("error").style.display = "block";
        return;
      }

      fetch("http://localhost:8000/api/get-landlord-data", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ token: token })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error();
        }
        return response.json();
      })
      .then(data => {
        document.getElementById("welcome").textContent = "Welcome back " + data.name;
        
        const tbody = document.getElementById("tenants-list");
        tbody.innerHTML = "";
        
        const tenants = data.tenants || [];
        tenants.forEach(tenant => {
          const tr = document.createElement("tr");
          
          // First Name (Read-only)
          const tdFirst = document.createElement("td");
          tdFirst.textContent = tenant.first_name || "";
          tr.appendChild(tdFirst);
          
          // Last Name (Read-only)
          const tdLast = document.createElement("td");
          tdLast.textContent = tenant.last_name || "";
          tr.appendChild(tdLast);
          
          // Email (Read-only)
          const tdEmail = document.createElement("td");
          tdEmail.textContent = tenant.email || "";
          tr.appendChild(tdEmail);

          // Editable Address
          const tdAddress = document.createElement("td");
          const inputAddress = document.createElement("input");
          inputAddress.type = "text";
          inputAddress.value = tenant.address || "";
          tdAddress.appendChild(inputAddress);
          tr.appendChild(tdAddress);

          // Editable Rent (Float)
          const tdRent = document.createElement("td");
          const inputRent = document.createElement("input");
          inputRent.type = "number";
          inputRent.step = "0.01";
          inputRent.value = tenant.rent !== undefined ? tenant.rent : "";
          tdRent.appendChild(inputRent);
          tr.appendChild(tdRent);

          // Editable Day (Int)
          const tdDay = document.createElement("td");
          const inputDay = document.createElement("input");
          inputDay.type = "number";
          inputDay.value = tenant.day !== undefined ? tenant.day : "";
          tdDay.appendChild(inputDay);
          tr.appendChild(tdDay);

          // Editable Date
          const tdDate = document.createElement("td");
          const inputDate = document.createElement("input");
          inputDate.type = "text";
          inputDate.value = tenant.date || "";
          tdDate.appendChild(inputDate);
          tr.appendChild(tdDate);

          // Submit Action & Feedback Status
          const tdAction = document.createElement("td");
          const btnSubmit = document.createElement("button");
          btnSubmit.textContent = "Save";
          
          const statusSpan = document.createElement("span");
          statusSpan.className = "status-msg";

          btnSubmit.onclick = function() {
            statusSpan.textContent = "Saving...";
            statusSpan.className = "status-msg";

            // Construct payload matching TenantChangeBody schema
            const payload = {
              ssoToken: token,
              tenantEmail: tenant.email,
              address: inputAddress.value,
              rent: parseFloat(inputRent.value) || 0.0,
              day: parseInt(inputDay.value, 10) || 0,
              date: inputDate.value
            };

            // Send request to your FastAPI / backend endpoint
            fetch("http://localhost:8000/api/change-tenant-info", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(payload)
            })
            .then(async response => {
              const resData = await response.json();
              if (!response.ok) {
                // Throws backend error message or default fallback
                throw new Error(resData.detail || resData.message || "Failed to update tenant.");
              }
              return resData;
            })
            .then(resData => {
              statusSpan.textContent = resData.message || "Success!";
              statusSpan.className = "status-msg status-success";
            })
            .catch(err => {
              statusSpan.textContent = err.message || "Error updating tenant.";
              statusSpan.className = "status-msg status-error";
            });
          };

          tdAction.appendChild(btnSubmit);
          tdAction.appendChild(statusSpan);
          tr.appendChild(tdAction);
          
          tbody.appendChild(tr);
        });
        
        document.getElementById("dashboard").style.display = "block";
      })
      .catch(() => {
        document.getElementById("error").style.display = "block";
      });
    };
  </script>
</body>
</html>
