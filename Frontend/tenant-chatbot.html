<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Keys - Tenant AI Support</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
  <script src="js/config.js"></script>
  
  <style>
    /* Keyfolio Design System */
    :root {
      --navy-900: #0d2036;
      --navy-800: #122b48;
      --navy-700: #17365d;
      --navy-600: #1e4272;
      --gold-600: #b08a2e;
      --gold-500: #c39a3b;
      --gold-400: #d4af5a;
      --gold-300: #e2c878;
      --ink: #1b2532;
      --ink-soft: #4d5a6b;
      --paper: #ffffff;
      --mist: #f6f7f9;
      --line: #e4e8ee;
      --radius: 10px;
      --shadow-sm: 0 1px 2px rgba(13, 32, 54, 0.06), 0 1px 6px rgba(13, 32, 54, 0.05);
      --shadow-md: 0 6px 24px rgba(13, 32, 54, 0.1);
      --font-display: "Marcellus", "Times New Roman", serif;
      --font-body: "Inter", -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--mist);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      color: var(--navy-800);
      font-size: clamp(26px, 3.4vw, 36px);
      margin: 0 0 4px;
      line-height: 1.15;
    }

    p { margin: 0 0 1em; }
    a { color: var(--navy-700); }

    .rule-label {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 0 18px;
      color: var(--gold-600);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .rule-label::after {
      content: "";
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, var(--gold-400), transparent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 22px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }
    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--navy-700);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover { background: var(--navy-600); box-shadow: var(--shadow-md); }

    .btn-outline {
      background: transparent;
      color: var(--navy-700);
      border-color: var(--navy-700);
    }
    .btn-outline:hover { background: rgba(23, 54, 93, 0.06); }

    .app-bar {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brand-name {
      font-family: var(--font-display);
      font-size: 19px;
      letter-spacing: 0.08em;
      color: var(--navy-800);
      text-transform: uppercase;
    }
    .brand-name small {
      display: block;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.34em;
      color: var(--gold-600);
    }

    .app-bar .spacer { margin-left: auto; }

    .app-main {
      max-width: 1160px;
      margin: 0 auto;
      padding: 40px 24px 72px;
    }
    .app-sub { color: var(--ink-soft); margin-bottom: 24px; font-size: 17px; }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      width: fit-content;
      max-width: 75%;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.5;
      white-space: normal; /* Ensures block HTML elements flow properly */
      word-break: break-word;
      animation: fadeUp 0.25s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.model {
      align-self: flex-start;
      background: var(--mist);
      border: 1px solid var(--line);
      color: var(--ink);
      border-top-left-radius: 2px;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--navy-700);
      color: var(--paper);
      box-shadow: var(--shadow-sm);
      border-top-right-radius: 2px;
    }

    .msg-author {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px; /* Slightly increased for better spacing with HTML blocks */
      display: block;
    }

    .msg.model .msg-author { color: var(--gold-600); }
    .msg.user .msg-author { color: var(--gold-300); }

    /* Clean styling for HTML elements generated by the AI */
    .msg-content p {
      margin: 0 0 12px 0;
    }
    .msg-content p:last-child {
      margin-bottom: 0;
    }
    .msg-content ul, .msg-content ol {
      margin: 0 0 12px 20px;
      padding: 0;
    }
    .msg-content ul:last-child, .msg-content ol:last-child {
      margin-bottom: 0;
    }
    .msg-content li {
      margin-bottom: 4px;
    }

    .chat-input-area {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      background: var(--paper);
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 15px;
      background: var(--mist);
      color: var(--ink);
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .chat-input-area input:focus {
      outline: none;
      border-color: var(--gold-500);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(195, 154, 59, 0.16);
    }
  </style>
</head>
<body class="app-body">

  <header class="app-bar">
    <a class="brand" href="tenant-dashboard.html">
      <img src="assets/logo.png" alt="Golden Keys LLC logo" style="height:38px">
      <span class="brand-name">Golden Keys<small>Tenant</small></span>
    </a>
    <div class="spacer"></div>
    <button class="btn btn-outline" onclick="window.location.reload()">Clear Chat</button>
  </header>

  <main class="app-main">
    <div class="rule-label">Tenant Dashboard</div>
    <h1>AI Support</h1>
    <p class="app-sub">Ask any questions you have about your lease or other landlord-related matters.</p>

    <div class="panel">
      <div id="chat-box" class="chat-box">
        <div class="msg model">
          <span class="msg-author">AI Assistant</span>
          <div class="msg-content">
            <p>Hello! Do you have any questions about your lease, maintenance requests, or other landlord-related matters?</p>
          </div>
        </div>
      </div>
      
      <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Type your inquiry here... (Press Enter to send)" autocomplete="off">
        <button id="send-btn" class="btn btn-primary" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>

  <script>
    const API_URL = API_BASE + "/api/chat";
    const history = [];
    
    // Store user data after the first authenticated request
    let cachedUserData = null;

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const btn = document.getElementById("send-btn");
      const text = input.value.trim();

      if (!text) return;

      appendMessage("YOU", text, "user");
      input.value = "";
      btn.disabled = true;
      btn.textContent = "Sending...";

      try {
        const payload = {
          history: history,
          new_message: text
        };

        if (cachedUserData) {
          payload.userData = cachedUserData;
        } else {
          const ssoToken = sessionStorage.getItem("ssoToken");
          const code = sessionStorage.getItem("code");

          if (ssoToken && code) {
            payload.ssoToken = ssoToken;
            payload.code = code;
          }
        }

        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        const reply = data.response || "No response received.";
        
        if (data.userData) {
          cachedUserData = data.userData;
        }
        
        history.push({ role: "user", text: text });
        history.push({ role: "model", text: reply });

        appendMessage("AI ASSISTANT", reply, "model");
      } catch (err) {
        appendMessage("SYSTEM ERROR", "<p>Could not reach backend API server.</p>", "model");
      } finally {
        btn.disabled = false;
        btn.textContent = "Send";
      }
    }

    function appendMessage(author, text, role) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${role}`;
      
      // We wrap the text in a msg-content div. 
      // Because we use innerHTML, the HTML tags sent by the AI will be parsed and rendered by the browser automatically.
      msgDiv.innerHTML = `
        <span class="msg-author">${author}</span>
        <div class="msg-content">${text}</div>
      `;
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById("user-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
